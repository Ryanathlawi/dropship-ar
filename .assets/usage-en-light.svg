<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="How to use it">
<defs>
<pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#eceff3" stroke-width="1" /></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#006c35" /><stop offset="100%" stop-color="#004d26" /></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#006c35" stop-opacity="0" /><stop offset="50%" stop-color="#006c35" stop-opacity="1" /><stop offset="100%" stop-color="#006c35" stop-opacity="0" /></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#006c35" stop-opacity="0.28" /><stop offset="100%" stop-color="#006c35" stop-opacity="0" /></radialGradient>
<linearGradient id="rule" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#006c35" stop-opacity="1" /><stop offset="100%" stop-color="#006c35" stop-opacity="0" /></linearGradient>
<clipPath id="frame"><rect width="1000" height="200" rx="8" /></clipPath>
</defs>
<style>@font-face{font-family:'Thmanyah';src:url(data:font/woff2;base64,) format('woff2');}
.a{font-family:'Thmanyah','Segoe UI',Tahoma,Arial,sans-serif;direction:rtl}
.f{font-family:'Thmanyah','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.st{animation:sh 7s ease-in-out infinite}
.st2{animation-delay:.9s}.st3{animation-delay:1.8s}.st4{animation-delay:2.7s}.st5{animation-delay:3.6s}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rw{animation:rise .55s ease-out backwards}
.ar{animation:slide 2.6s ease-in-out infinite}@keyframes slide{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(-6px);opacity:1}}
.ln{animation:cyc 13.5s linear infinite}.ln2,.ln3{opacity:0}.ln2{animation-delay:4.5s}.ln3{animation-delay:9s}
@keyframes cyc{0%{opacity:0}2%{opacity:1}31%{opacity:1}33%{opacity:0}100%{opacity:0}}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.dt{animation:pulse 2.6s ease-in-out infinite}</style>
<g clip-path="url(#frame)"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect width="1000" height="200" fill="#ffffff" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect width="1000" height="200" fill="url(#g)" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><circle cx="90" cy="40" r="230" fill="url(#glow)" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x=".5" y=".5" width="999" height="199" rx="8" fill="none" stroke="#d0d7de" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="995" width="5" height="200" fill="url(#bar)" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><g transform="rotate(-22 170 100.0)"><rect class="st " x="50" y="-140" width="2" height="500" fill="url(#streak)" /><rect class="st st2" x="108" y="-140" width="3" height="500" fill="url(#streak)" /><rect class="st st3" x="170" y="-140" width="2" height="500" fill="url(#streak)" /><rect class="st st4" x="234" y="-140" width="4" height="500" fill="url(#streak)" /><rect class="st st5" x="296" y="-140" width="2" height="500" fill="url(#streak)" /></g></g><g class="rw" style="animation-delay:0.00s"><g transform="matrix(-1 0 0 1 1000.0 0)"><circle cx="936" cy="44" r="13" fill="#006c35" /></g><text class="m" x="64" y="49" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text class="f" x="90" y="49" font-size="17" font-weight="700" fill="#0d1117" text-anchor="start">Download one of the two files and run it</text><text class="f" x="90" y="69" font-size="13.5" fill="#57606a" text-anchor="start">It asks for admin rights because it blocks servers through the Windows firewall</text></g><g class="rw" style="animation-delay:0.10s"><g transform="matrix(-1 0 0 1 1000.0 0)"><circle cx="936" cy="90" r="13" fill="#006c35" /></g><text class="m" x="64" y="95" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text class="f" x="90" y="95" font-size="17" font-weight="700" fill="#0d1117" text-anchor="start">Click any server to block it</text><text class="f" x="90" y="115" font-size="13.5" fill="#57606a" text-anchor="start">From the map or the list, or press a preset that blocks a group of servers at once</text></g><g class="rw" style="animation-delay:0.20s"><g transform="matrix(-1 0 0 1 1000.0 0)"><circle cx="936" cy="136" r="13" fill="#006c35" /></g><text class="m" x="64" y="141" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text class="f" x="90" y="141" font-size="17" font-weight="700" fill="#0d1117" text-anchor="start">That's it, close the window</text><text class="f" x="90" y="161" font-size="13.5" fill="#57606a" text-anchor="start">The block keeps working after you close the app, until you lift it</text></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="60" y="170" width="880" height="1" fill="#d0d7de" /></g><text class="f" x="60" y="190" font-size="12.5" fill="#006c35" text-anchor="start">⚠ Don't queue with other people unless they block the same servers, and if you can't connect, press “unblock all” right away</text></g>
</svg>