<style>@font-face{font-family:'Thmanyah';src:url(data:font/woff2;base64,) format('woff2');}
.a{font-family:'Thmanyah','Segoe UI',Tahoma,Arial,sans-serif;direction:rtl}
.f{font-family:'Thmanyah','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.st{animation:sh 7s ease-in-out infinite}
.st2{animation-delay:.9s}.st3{animation-delay:1.8s}.st4{animation-delay:2.7s}.st5{animation-delay:3.6s}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rw{animation:rise .55s ease-out backwards}
.ar{animation:slide 2.6s ease-in-out infinite}@keyframes slide{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(-6px);opacity:1}}
.ln{animation:cyc 13.5s linear infinite}.ln2,.ln3{opacity:0}.ln2{animation-delay:4.5s}.ln3{animation-delay:9s}
