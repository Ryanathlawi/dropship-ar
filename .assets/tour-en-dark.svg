<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" role="img" aria-label="The guided tour">
<defs>
<pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#171d25" stroke-width="1" /></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2ebf6e" /><stop offset="100%" stop-color="#006c35" /></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2ebf6e" stop-opacity="0" /><stop offset="50%" stop-color="#2ebf6e" stop-opacity="1" /><stop offset="100%" stop-color="#2ebf6e" stop-opacity="0" /></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2ebf6e" stop-opacity="0.28" /><stop offset="100%" stop-color="#2ebf6e" stop-opacity="0" /></radialGradient>
<linearGradient id="rule" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#2ebf6e" stop-opacity="1" /><stop offset="100%" stop-color="#2ebf6e" stop-opacity="0" /></linearGradient>
<clipPath id="frame"><rect width="1000" height="110" rx="8" /></clipPath>
</defs>
<style>@font-face{font-family:'Thmanyah';src:url(data:font/woff2;base64,) format('woff2');}
.a{font-family:'Thmanyah','Segoe UI',Tahoma,Arial,sans-serif;direction:rtl}
.f{font-family:'Thmanyah','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.st{animation:sh 7s ease-in-out infinite}
.st2{animation-delay:.9s}.st3{animation-delay:1.8s}.st4{animation-delay:2.7s}.st5{animation-delay:3.6s}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rw{animation:rise .55s ease-out backwards}
.ar{animation:slide 2.6s ease-in-out infinite}@keyframes slide{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(-6px);opacity:1}}
.ln{animation:cyc 13.5s linear infinite}.ln2,.ln3{opacity:0}.ln2{animation-delay:4.5s}.ln3{animation-delay:9s}
@keyframes cyc{0%{opacity:0}2%{opacity:1}31%{opacity:1}33%{opacity:0}100%{opacity:0}}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.dt{animation:pulse 2.6s ease-in-out infinite}</style>
<g clip-path="url(#frame)"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect width="1000" height="110" fill="#0d1117" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect width="1000" height="110" fill="url(#g)" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><circle cx="90" cy="40" r="230" fill="url(#glow)" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x=".5" y=".5" width="999" height="109" rx="8" fill="none" stroke="#21262d" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="995" width="5" height="110" fill="url(#bar)" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><g transform="rotate(-22 170 55.0)"><rect class="st " x="50" y="-140" width="2" height="410" fill="url(#streak)" /><rect class="st st2" x="108" y="-140" width="3" height="410" fill="url(#streak)" /><rect class="st st3" x="170" y="-140" width="2" height="410" fill="url(#streak)" /><rect class="st st4" x="234" y="-140" width="4" height="410" fill="url(#streak)" /><rect class="st st5" x="296" y="-140" width="2" height="410" fill="url(#streak)" /></g></g><text class="f" x="60" y="40" font-size="15" fill="#f0f6fc" text-anchor="start">It shows up after the welcome screen and explains every part of the screen: the map, the server list,</text><text class="f" x="60" y="66" font-size="15" fill="#8b949e" text-anchor="start">the presets, the best route, mini mode, the unblock button, games, the tabs, the status bar and the keys</text><text class="f" x="60" y="92" font-size="15" fill="#8b949e" text-anchor="start">Move with the buttons or Enter and the arrow keys, Esc skips it, and you can replay it from options or help</text></g>
</svg>