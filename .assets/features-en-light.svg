<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 378" width="1000" height="378" role="img" aria-label="Features">
<defs>
<pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#eceff3" stroke-width="1" /></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#006c35" /><stop offset="100%" stop-color="#004d26" /></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#006c35" stop-opacity="0" /><stop offset="50%" stop-color="#006c35" stop-opacity="1" /><stop offset="100%" stop-color="#006c35" stop-opacity="0" /></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#006c35" stop-opacity="0.28" /><stop offset="100%" stop-color="#006c35" stop-opacity="0" /></radialGradient>
<linearGradient id="rule" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#006c35" stop-opacity="1" /><stop offset="100%" stop-color="#006c35" stop-opacity="0" /></linearGradient>
<clipPath id="frame"><rect width="1000" height="378" rx="8" /></clipPath>
</defs>
<style>@font-face{font-family:'Thmanyah';src:url(data:font/woff2;base64,) format('woff2');}
.a{font-family:'Thmanyah','Segoe UI',Tahoma,Arial,sans-serif;direction:rtl}
.f{font-family:'Thmanyah','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.st{animation:sh 7s ease-in-out infinite}
.st2{animation-delay:.9s}.st3{animation-delay:1.8s}.st4{animation-delay:2.7s}.st5{animation-delay:3.6s}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rw{animation:rise .55s ease-out backwards}
.ar{animation:slide 2.6s ease-in-out infinite}@keyframes slide{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(-6px);opacity:1}}
.ln{animation:cyc 13.5s linear infinite}.ln2,.ln3{opacity:0}.ln2{animation-delay:4.5s}.ln3{animation-delay:9s}
@keyframes cyc{0%{opacity:0}2%{opacity:1}31%{opacity:1}33%{opacity:0}100%{opacity:0}}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.dt{animation:pulse 2.6s ease-in-out infinite}</style>
<g clip-path="url(#frame)"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect width="1000" height="378" fill="#ffffff" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect width="1000" height="378" fill="url(#g)" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><circle cx="90" cy="40" r="230" fill="url(#glow)" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x=".5" y=".5" width="999" height="377" rx="8" fill="none" stroke="#d0d7de" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="995" width="5" height="378" fill="url(#bar)" /></g><g transform="matrix(-1 0 0 1 1000.0 0)"><g transform="rotate(-22 170 189.0)"><rect class="st " x="50" y="-140" width="2" height="588" fill="url(#streak)" /><rect class="st st2" x="108" y="-140" width="3" height="588" fill="url(#streak)" /><rect class="st st3" x="170" y="-140" width="2" height="588" fill="url(#streak)" /><rect class="st st4" x="234" y="-140" width="4" height="588" fill="url(#streak)" /><rect class="st st5" x="296" y="-140" width="2" height="588" fill="url(#streak)" /></g></g><text class="f" x="60" y="44" font-size="15" fill="#57606a" text-anchor="start">Interface and experience by Ryan Athlawi; blocking and the server list come from stormy's original dropship</text><g class="rw" style="animation-delay:0.00s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="69" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="78" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">English and Arabic</text><text class="f" x="285" y="78" font-size="15" fill="#57606a" text-anchor="start">Opens in your PC's language, and you can switch it any time in options</text></g><g class="rw" style="animation-delay:0.08s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="99" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="108" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">The new launcher</text><text class="f" x="285" y="108" font-size="15" fill="#57606a" text-anchor="start">A live world map: routes to every allowed server, flags, and a gold lock on the best</text></g><g class="rw" style="animation-delay:0.16s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="129" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="138" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">Blocking presets</text><text class="f" x="285" y="138" font-size="15" fill="#57606a" text-anchor="start">One button or key applies a saved block (Europe = F1), or make your own</text></g><g class="rw" style="animation-delay:0.24s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="159" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="168" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">Live ping</text><text class="f" x="285" y="168" font-size="15" fill="#57606a" text-anchor="start">Every 15 seconds, measured inside the server's own network if its address stays silent</text></g><g class="rw" style="animation-delay:0.32s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="189" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="198" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">Other blockers</text><text class="f" x="285" y="198" font-size="15" fill="#57606a" text-anchor="start">Shows blocks other blockers left in Windows Firewall and removes them in one click</text></g><g class="rw" style="animation-delay:0.40s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="219" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="228" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">Thmanyah font</text><text class="f" x="285" y="228" font-size="15" fill="#57606a" text-anchor="start">Built into the exe for all text, designed by Thmanyah</text></g><g class="rw" style="animation-delay:0.48s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="249" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="258" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">Guided tour</text><text class="f" x="285" y="258" font-size="15" fill="#57606a" text-anchor="start">14 steps that explain every part of the app on first launch, replayable from options</text></g><g class="rw" style="animation-delay:0.56s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="279" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="288" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">Calm palette</text><text class="f" x="285" y="288" font-size="15" fill="#57606a" text-anchor="start">Teal on graphite in dark and light modes, nothing loud</text></g><g class="rw" style="animation-delay:0.64s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="309" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="318" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">Animated build</text><text class="f" x="285" y="318" font-size="15" fill="#57606a" text-anchor="start">Routes flow and dots pulse only while the window is focused, zero CPU while you play</text></g><g class="rw" style="animation-delay:0.72s"><g transform="matrix(-1 0 0 1 1000.0 0)"><rect x="935" y="339" width="5" height="5" fill="#006c35" /></g><text class="f" x="78" y="348" font-size="15" font-weight="700" fill="#0d1117" text-anchor="start">Arabic in egui</text><text class="f" x="285" y="348" font-size="15" fill="#57606a" text-anchor="start">A small patch to the epaint library to shape Arabic letters and mixed text</text></g></g>
</svg>